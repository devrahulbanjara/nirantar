[project]
name = "nirantar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devrahulbanjara", email = "rdbanjara07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "fastmcp>=3.4.7",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio,postgresql]>=2.0.52",
    "tzdata>=2026.3",
]

[project.scripts]
nirantar = "nirantar:main"

[tool.fastapi]
entrypoint = "nirantar.main:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
